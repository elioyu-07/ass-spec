[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ass-spec"
version = "1.1.4"
description = "ass-spec: the Assayer plugin that reviews Markdown product and software specifications against the canonical 18-point quality policy."
requires-python = ">=3.11"
dependencies = ["assayer>=0.1.1,<0.2.0", "jsonschema==4.26.0"]

[project.entry-points."assayer.plugins"]
ass-spec = "ass_spec:registration"

[project.entry-points."assayer.release_acceptance"]
ass-spec = "ass_spec.release_acceptance:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ass_spec = ["*.json", "*.md", "evaluation/*"]

[tool.uv.sources]
assayer = { url = "https://github.com/elioyu-07/Assayer/releases/download/v0.1.1/assayer-0.1.1-py3-none-any.whl" }
